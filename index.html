<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillSwap · 技能交换平台</title>
<style>
  :root{
    --bg:#f7f8fa;
    --panel:#ffffff;
    --line:#e8eaef;
    --text:#1b1f2a;
    --text-2:#5b6478;
    --text-3:#8b93a7;
    --brand:#4b5cf6;
    --brand-soft:#eef0ff;
    --brand-deep:#3542c9;
    --ok:#12a06a;
    --ok-soft:#e6f7f0;
    --warn:#e8830c;
    --warn-soft:#fff4e5;
    --danger:#e0455a;
    --danger-soft:#fdedef;
    --radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:14px;color:var(--text)}

  /* ---------- 布局 ---------- */
  .shell{max-width:1180px;margin:0 auto;padding:0 20px 80px}

  header.top{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.86);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .top-inner{
    max-width:1180px;margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;gap:28px;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.2px}
  .logo-mark{
    width:32px;height:32px;border-radius:9px;
    background:linear-gradient(135deg,#5b6bff,#7c4dff);
    display:grid;place-items:center;color:#fff;font-size:16px;
    box-shadow:0 4px 12px -3px rgba(75,92,246,.5);
  }
  nav.tabs{display:flex;gap:4px;margin-left:8px}
  nav.tabs button{
    padding:7px 14px;border-radius:9px;font-size:14px;color:var(--text-2);
    font-weight:500;transition:.15s;
  }
  nav.tabs button:hover{background:var(--bg);color:var(--text)}
  nav.tabs button.on{background:var(--brand-soft);color:var(--brand-deep);font-weight:600}
  .badge-count{
    display:inline-block;min-width:18px;padding:0 5px;height:18px;line-height:18px;
    background:var(--danger);color:#fff;border-radius:9px;font-size:11px;
    text-align:center;margin-left:5px;font-weight:600;
  }
  .top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .me{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:99px;background:var(--bg)}
  .me-txt{font-size:13px;font-weight:600}
  .me-sub{font-size:11px;color:var(--text-3);font-weight:400;line-height:1.2}

  .avatar{
    width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
    color:#fff;font-size:13px;font-weight:600;flex-shrink:0;
  }
  .avatar.lg{width:52px;height:52px;font-size:18px;border-radius:16px}

  .btn{
    padding:9px 16px;border-radius:10px;font-size:14px;font-weight:600;
    transition:.15s;display:inline-flex;align-items:center;gap:6px;justify-content:center;
  }
  .btn-p{background:var(--brand);color:#fff}
  .btn-p:hover{background:var(--brand-deep)}
  .btn-g{background:var(--panel);color:var(--text);border:1px solid var(--line)}
  .btn-g:hover{background:var(--bg);border-color:#d8dce6}
  .btn-ok{background:var(--ok);color:#fff}
  .btn-ok:hover{background:#0d8a5b}
  .btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* ---------- 通用 ---------- */
  .sec-title{font-size:19px;font-weight:700;letter-spacing:-.2px;margin-bottom:4px}
  .sec-sub{font-size:13.5px;color:var(--text-3);margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .chip{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:500;
  }
  .chip-offer{background:var(--brand-soft);color:var(--brand-deep)}
  .chip-want{background:var(--warn-soft);color:#a85c05}
  .empty{
    padding:56px 20px;text-align:center;color:var(--text-3);font-size:14px;
    background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);
  }
  .empty-ico{font-size:32px;margin-bottom:10px;opacity:.5}

  .view{display:none;animation:fade .22s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- 广场 ---------- */
  .hero{
    margin:26px 0 22px;padding:26px 28px;border-radius:18px;
    background:linear-gradient(120deg,#4b5cf6,#7b5cff 60%,#9c6bff);
    color:#fff;position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;right:-60px;top:-70px;width:230px;height:230px;
    border-radius:50%;background:rgba(255,255,255,.12);
  }
  .hero h1{font-size:25px;font-weight:700;letter-spacing:-.4px;margin-bottom:7px}
  .hero p{font-size:14px;opacity:.9;max-width:520px}
  .hero-stats{display:flex;gap:30px;margin-top:18px;position:relative;z-index:1}
  .hero-stats div span{display:block;font-size:22px;font-weight:700;line-height:1.3}
  .hero-stats div small{font-size:12px;opacity:.82}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  .search{
    flex:1;min-width:220px;padding:9px 14px;border-radius:10px;
    border:1px solid var(--line);background:var(--panel);outline:none;
  }
  .search:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .fbtn{
    padding:7px 14px;border-radius:99px;font-size:13px;border:1px solid var(--line);
    background:var(--panel);color:var(--text-2);font-weight:500;transition:.15s;
  }
  .fbtn:hover{border-color:#cfd5e4}
  .fbtn.on{background:var(--text);color:#fff;border-color:var(--text)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
  .u-card{padding:18px;display:flex;flex-direction:column;gap:13px;transition:.18s}
  .u-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px -14px rgba(16,24,40,.2)}
  .u-head{display:flex;gap:12px;align-items:flex-start}
  .u-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px}
  .u-role{font-size:12.5px;color:var(--text-3);margin-top:1px}
  .lv{font-size:11px;padding:1px 7px;border-radius:99px;font-weight:600}
  .lv-a{background:var(--ok-soft);color:#0a7a51}
  .lv-b{background:var(--brand-soft);color:var(--brand-deep)}
  .u-skills{display:flex;flex-direction:column;gap:7px}
  .sk-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .sk-lb{font-size:11.5px;color:var(--text-3);width:30px;flex-shrink:0}
  .u-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
  .match-score{font-size:12.5px;color:var(--text-3)}
  .match-score b{color:var(--ok);font-size:14px}

  /* ---------- 匹配 ---------- */
  .match-banner{
    padding:16px 20px;border-radius:var(--radius);margin-bottom:18px;
    background:var(--ok-soft);border:1px solid #bfe9d7;color:#0a6b48;font-size:14px;
  }
  .match-banner b{font-weight:700}
  .flow{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
  .flow-node{
    display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);
  }
  .flow-node.hot{border-color:#bfe9d7;background:var(--ok-soft)}
  .flow-node small{display:block;font-size:11.5px;color:var(--text-3)}
  .flow-node strong{font-size:13.5px;font-weight:600}
  .flow-arrow{color:var(--text-3);font-size:18px}
  .m-card{
    display:flex;align-items:center;gap:18px;padding:20px 22px;margin-bottom:12px;
  }
  .m-body{flex:1;min-width:0}
  .m-title{font-size:16px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .m-desc{font-size:13.5px;color:var(--text-2);margin-bottom:11px}
  .m-meta{display:flex;gap:18px;font-size:12.5px;color:var(--text-3);flex-wrap:wrap}
  .m-score{
    text-align:center;padding:0 6px;flex-shrink:0;
  }
  .m-score b{display:block;font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1.1}
  .m-score small{font-size:11px;color:var(--text-3)}
  .ring{width:64px;height:64px;position:relative;flex-shrink:0}
  .ring svg{transform:rotate(-90deg)}
  .ring span{
    position:absolute;inset:0;display:grid;place-items:center;
    font-size:15px;font-weight:800;letter-spacing:-.5px;
  }

  /* ---------- 发布 ---------- */
  .form-wrap{max-width:660px}
  .field{margin-bottom:17px}
  .field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:7px}
  .field .hint{font-size:12px;color:var(--text-3);font-weight:400;margin-left:6px}
  .field input[type=text],.field textarea,.field select{
    width:100%;padding:10px 13px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);outline:none;transition:.15s;resize:vertical;
  }
  .field input:focus,.field textarea:focus,.field select:focus{
    border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)
  }
  .tagpick{display:flex;gap:8px;flex-wrap:wrap}
  .tag{
    padding:6px 13px;border-radius:99px;font-size:13px;border:1px solid var(--line);
    background:var(--panel);color:var(--text-2);transition:.15s;font-weight:500;
  }
  .tag:hover{border-color:var(--brand);color:var(--brand)}
  .tag.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,90px);
    background:var(--text);color:#fff;padding:11px 22px;border-radius:99px;
    font-size:14px;font-weight:500;box-shadow:0 12px 30px -8px rgba(0,0,0,.35);
    transition:transform .3s cubic-bezier(.2,.9,.3,1.2);z-index:99;
  }
  .toast.on{transform:translate(-50%,0)}

  /* ---------- 消息 ---------- */
  .msg{padding:18px 22px;margin-bottom:12px;display:flex;gap:16px;align-items:center}
  .msg-body{flex:1;min-width:0}
  .msg-title{font-size:14.5px;font-weight:600;margin-bottom:4px}
  .msg-title i{font-style:normal;color:var(--brand);font-style:italic}
  .msg-sub{font-size:12.5px;color:var(--text-3)}
  .st{
    padding:4px 11px;border-radius:99px;font-size:12px;font-weight:600;flex-shrink:0;
  }
  .st-p{background:var(--warn-soft);color:#a85c05}
  .st-a{background:var(--ok-soft);color:#0a7a51}
  .st-d{background:#f1f2f6;color:var(--text-3)}
  .msg-act{display:flex;gap:8px;flex-shrink:0}
  .section-gap{margin-bottom:12px}

  @media(max-width:820px){
    .top-inner{gap:14px;flex-wrap:wrap}
    nav.tabs{order:3;width:100%;overflow-x:auto;padding-bottom:2px}
    .me-txt,.me-sub{display:none}
    .m-card{flex-wrap:wrap}
    .row2{grid-template-columns:1fr}
    .hero{padding:20px}
    .hero h1{font-size:20px}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="logo">
      <div class="logo-mark">⇄</div>
      <span>SkillSwap</span>
    </div>
    <nav class="tabs" id="nav">
      <button data-v="square" class="on">技能广场</button>
      <button data-v="match">智能匹配</button>
      <button data-v="publish">发布需求</button>
      <button data-v="inbox">交换请求<span class="badge-count" id="navBadge" style="display:none">0</span></button>
    </nav>
    <div class="top-right">
      <div class="me">
        <div class="avatar" id="meAvatar">我</div>
        <div>
          <div class="me-txt">我</div>
          <div class="me-sub">Lv.A 交换达人</div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="shell">

  <!-- ============ 技能广场 ============ -->
  <section class="view on" id="v-square">
    <div class="hero">
      <h1>用你的技能，换你想学的技能</h1>
      <p>不花钱，不报班。把你擅长的教给别人，把别人擅长的学过来——一次交换，两个人同时升级。</p>
      <div class="hero-stats">
        <div><span id="statPeople">0</span><small>平台用户</small></div>
        <div><span id="statSkills">0</span><small>可交换技能</small></div>
        <div><span id="statMatch">0</span><small>潜在交换组合</small></div>
      </div>
    </div>

    <div class="sec-title">技能广场</div>
    <div class="sec-sub">浏览平台上的交换者，看看他们的「能教」和「想学」</div>

    <div class="filters">
      <input class="search" id="search" placeholder="搜索技能、昵称，例如：Python / 摄影 / 口语…">
      <button class="fbtn on" data-f="all">全部</button>
      <button class="fbtn" data-f="matchable">可与我交换</button>
      <button class="fbtn" data-f="new">新加入</button>
    </div>

    <div class="grid" id="userGrid"></div>
  </section>

  <!-- ============ 智能匹配 ============ -->
  <section class="view" id="v-match">
    <div class="sec-title">智能匹配</div>
    <div class="sec-sub">基于「我会的」与「我想学的」双向互补，推荐最值得交换的对象</div>

    <div class="match-banner" id="matchBanner"></div>

    <div class="flow" id="flow"></div>

    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px">
      <div style="font-size:15px;font-weight:700">匹配结果</div>
      <button class="btn btn-g btn-sm" id="reshuffle">重新计算匹配</button>
    </div>
    <div id="matchList"></div>
  </section>

  <!-- ============ 发布需求 ============ -->
  <section class="view" id="v-publish">
    <div class="form-wrap">
      <div class="sec-title">发布你的交换需求</div>
      <div class="sec-sub">说明你能提供什么、想获得什么，系统会立刻把你加入匹配池</div>

      <div class="card" style="padding:24px">
        <div class="row2">
          <div class="field">
            <label>你的昵称</label>
            <input type="text" id="pName" placeholder="例如：林小舟">
          </div>
          <div class="field">
            <label>当前身份</label>
            <input type="text" id="pRole" placeholder="例如：产品设计师">
          </div>
        </div>

        <div class="field">
          <label>我能教 <span class="hint">最多选 3 个，这是你的「筹码」</span></label>
          <div class="tagpick" id="teachTags"></div>
        </div>

        <div class="field">
          <label>我想学 <span class="hint">最多选 2 个，这是你的「目标」</span></label>
          <div class="tagpick" id="learnTags"></div>
        </div>

        <div class="field">
          <label>一句话介绍 <span class="hint">选填</span></label>
          <textarea id="pDesc" rows="3" placeholder="说说你的交换偏好，例如：希望周末线下，每次 1.5 小时"></textarea>
        </div>

        <div style="display:flex;gap:10px;margin-top:22px">
          <button class="btn btn-p" id="submitPub">发布并加入匹配池</button>
          <button class="btn btn-g" id="resetPub">清空</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 交换请求 ============ -->
  <section class="view" id="v-inbox">
    <div class="sec-title">交换请求</div>
    <div class="sec-sub">你发出的邀请，和收到的邀请都在这里</div>
    <div id="inboxList"></div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   SkillSwap — 技能交换平台 Demo
   纯前端 / 零依赖 / localStorage 持久化
   ========================================================= */

const COLORS = ['#4b5cf6','#12a06a','#e8830c','#e0455a','#7b5cff','#0ea5b7','#d8488f','#5b8def'];
const PALETTE = ['Python','产品设计','摄影','英语口语','视频剪辑','吉他','数据分析','UI设计','写作','烘焙','健身指导','日语','投资理财','演讲表达','插画','Excel','咖啡拉花','吉他弹唱'];
const STORE_KEY = 'skillswap.v1';
const ME_KEY = 'skillswap.me';

/* ---------- 种子数据 ---------- */
const SEED_USERS = [
  {id:'u1',name:'林小舟',role:'产品设计师',teach:['UI设计','产品设计'],learn:['Python','数据分析'],desc:'擅长从 0 到 1 做产品原型，想往数据方向发展。',joined:'两周前',tag:'hot'},
  {id:'u2',name:'陈默',role:'后端工程师',teach:['Python','数据分析'],learn:['产品设计','英语口语'],desc:'写了六年后端，最近想做自己的小产品，缺设计思维。',joined:'一周前'},
  {id:'u3',name:'苏晚',role:'英语老师',teach:['英语口语','写作'],learn:['视频剪辑'],desc:'雅思 8 分，可以陪你练口语，想学剪 vlog。',joined:'三天前',tag:'new'},
  {id:'u4',name:'阿哲',role:'独立摄影师',teach:['摄影','视频剪辑'],learn:['投资理财','演讲表达'],desc:'拍了八年纪录片，教你构图和调色，想学怎么管钱。',joined:'一周前'},
  {id:'u5',name:'周雨桐',role:'数据分析师',teach:['数据分析','Excel'],learn:['摄影','插画'],desc:'日常工作就是跟数据打交道，想培养一个能出门的爱好。',joined:'五天前'},
  {id:'u6',name:'老K',role:'自由投资人',teach:['投资理财'],learn:['Python','健身指导'],desc:'十年投资经验，想学编程做量化，顺便练练身体。',joined:'昨天',tag:'new'},
  {id:'u7',name:'许清',role:'私教教练',teach:['健身指导'],learn:['烘焙','日语'],desc:'带你科学训练，想学做面包，也有点日漫情结。',joined:'四天前'},
  {id:'u8',name:'Nina',role:'插画师',teach:['插画','UI设计'],learn:['视频剪辑','写作'],desc:'自由插画三年，想把自己的创作过程做成视频。',joined:'两周前'},
  {id:'u9',name:'老谭',role:'咖啡店老板',teach:['咖啡拉花','烘焙'],learn:['摄影','写作'],desc:'开了家小店，想拍出好看的图讲讲咖啡故事。',joined:'六天前'},
  {id:'u10',name:'小林',role:'吉他老师',teach:['吉他','吉他弹唱'],learn:['英语口语','Excel'],desc:'教了五年吉他，想练好口语出国演出。',joined:'三天前',tag:'new'}
];

const DEFAULT_ME = {
  id:'me', name:'我', role:'交换者', avatar:'我',
  teach:['Python','数据分析'], learn:['摄影','视频剪辑'],
  desc:'我想用技术换一点审美能力。'
};

/* ---------- 状态 ---------- */
let state = {users:[], requests:[], me:{...DEFAULT_ME}};

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      state.users = (s.users && s.users.length) ? s.users : SEED_USERS.map(u=>({...u}));
      state.requests = s.requests || [];
      state.me = s.me || {...DEFAULT_ME};
      return;
    }
  }catch(e){ /* 数据损坏则重置 */ }
  state.users = SEED_USERS.map(u=>({...u}));
  state.requests = [];
  state.me = {...DEFAULT_ME};
  save();
}

function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      users:state.users, requests:state.requests, me:state.me
    }));
  }catch(e){}
}

/* ---------- 工具 ---------- */
function colorOf(str){
  let h=0;
  for(let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) % 9973;
  return COLORS[h % COLORS.length];
}
function initial(name){
  if(!name) return '?';
  // 中文取最后一字，英文取首字母
  if(/[\u4e00-\u9fa5]/.test(name)) return name.slice(-1);
  return name[0].toUpperCase();
}
function avatarHTML(name, cls){
  return `<div class="avatar ${cls||''}" style="background:${colorOf(name)}">${initial(name)}</div>`;
}
function levelOf(u){
  const n = (u.teach||[]).length + (u.learn||[]).length;
  return n >= 3 ? {t:'Lv.A 交换达人', c:'lv-a'} : {t:'Lv.B 活跃', c:'lv-b'};
}
function overlap(a,b){
  const set = new Set(b||[]);
  return (a||[]).filter(x=>set.has(x));
}
/* 反向互补也是高价值信号：他教的正好是我想要的 */
function matchScore(a, b){
  // a 是「我」或某个视角用户，b 是候选
  const teachA = a.teach||[], learnA = a.learn||[];
  const teachB = b.teach||[], learnB = b.learn||[];
  const getFromB = overlap(learnA, teachB);   // 我能从 B 学到
  const giveToB  = overlap(teachA, learnB);   // 我能教给 B
  if(!getFromB.length || !giveToB.length) return {score:0, getFromB, giveToB, dead:true};
  let s = 40;
  s += getFromB.length * 18;
  s += giveToB.length * 14;
  if(b.tag === 'hot') s += 5;
  if(b.tag === 'new') s += 3;
  return {score:Math.min(98, s), getFromB, giveToB, dead:false};
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove('on'), 2200);
}
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* =========================================================
   技能广场
   ========================================================= */
let filter = 'all', keyword = '';

function renderSquare(){
  const grid = document.getElementById('userGrid');
  const me = state.me;
  let list = state.users.filter(u=>{
    if(filter === 'matchable'){
      const r = matchScore(me, u);
      if(r.dead) return false;
    }
    if(filter === 'new' && u.tag !== 'new') return false;
    if(keyword){
      const k = keyword.toLowerCase();
      const hay = (u.name + u.role + (u.teach||[]).join('') + (u.learn||[]).join('')).toLowerCase();
      if(!hay.includes(k)) return false;
    }
    return true;
  });

  // 可交换的排前面，按匹配分排序
  list = list.map(u=>({u, r:matchScore(me,u)}))
             .sort((a,b)=> b.r.score - a.r.score || a.u.name.localeCompare(b.u.name))
             .map(x=>x.u);

  if(!list.length){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <div class="empty-ico">🔍</div>没有找到符合条件的交换者<br>
      <span style="font-size:12.5px">试试换个关键词，或切换筛选条件</span></div>`;
    return;
  }

  grid.innerHTML = list.map(u=>{
    const r = matchScore(me, u);
    const lv = levelOf(u);
    const isMe = u.id === 'me';
    return `<div class="card u-card">
      <div class="u-head">
        ${avatarHTML(u.name,'lg')}
        <div style="flex:1;min-width:0">
          <div class="u-name">${esc(u.name)}
            ${u.tag==='new'?'<span class="chip" style="background:#fdedef;color:#c23047">新加入</span>':''}
            ${u.tag==='hot'?'<span class="chip" style="background:#fff4e5;color:#a85c05">热门</span>':''}
          </div>
          <div class="u-role">${esc(u.role)} · ${esc(u.joined||'最近')}加入</div>
        </div>
      </div>
      <div class="u-skills">
        <div class="sk-row"><span class="sk-lb">能教</span>${(u.teach||[]).map(s=>`<span class="chip chip-offer">${esc(s)}</span>`).join('')||'<span style="font-size:12.5px;color:#8b93a7">—</span>'}</div>
        <div class="sk-row"><span class="sk-lb">想学</span>${(u.learn||[]).map(s=>`<span class="chip chip-want">${esc(s)}</span>`).join('')||'<span style="font-size:12.5px;color:#8b93a7">—</span>'}</div>
      </div>
      ${u.desc?`<div style="font-size:13px;color:#5b6478;padding:10px 12px;background:#f7f8fa;border-radius:9px">${esc(u.desc)}</div>`:''}
      <div class="u-foot">
        <span class="match-score">${r.dead ? `<span class="chip ${lv.c}">${lv.t}</span>` : `匹配度 <b>${r.score}%</b>`}</span>
        ${isMe ? '<span style="font-size:12.5px;color:#8b93a7">这是我的资料</span>'
               : r.dead ? `<button class="btn btn-g btn-sm" disabled>暂无互补</button>`
                        : `<button class="btn btn-p btn-sm" data-invite="${u.id}">发起交换</button>`}
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('[data-invite]').forEach(b=>{
    b.addEventListener('click', ()=>invite(b.dataset.invite));
  });
}

function renderStats(){
  document.getElementById('statPeople').textContent = state.users.length + 1;
  const set = new Set();
  state.users.forEach(u=>(u.teach||[]).forEach(s=>set.add(s)));
  document.getElementById('statSkills').textContent = set.size;
  let n = 0;
  state.users.forEach(u=>{ if(!matchScore(state.me,u).dead) n++; });
  document.getElementById('statMatch').textContent = n;
}

/* =========================================================
   智能匹配
   ========================================================= */
function renderMatch(){
  const me = state.me;
  const banner = document.getElementById('matchBanner');
  const flow = document.getElementById('flow');
  const listEl = document.getElementById('matchList');

  banner.innerHTML = `当前你的交换画像：能教 <b>${(me.teach||[]).join('、')||'（未设置）'}</b>，
    想学 <b>${(me.learn||[]).join('、')||'（未设置）'}</b>。
    系统正在从 <b>${state.users.length}</b> 位交换者中为你寻找双向互补对象。`;

  // 流程可视化
  flow.innerHTML = `
    <div class="flow-node">
      ${avatarHTML(me.name)}
      <div><small>你</small><strong>教 ${(me.teach||[]).join('/')}</strong></div>
    </div>
    <div class="flow-arrow">⇄</div>
    <div class="flow-node hot">
      <div style="font-size:20px">🎯</div>
      <div><small>匹配引擎</small><strong>双向互补打分</strong></div>
    </div>
    <div class="flow-arrow">→</div>
    <div class="flow-node">
      <div style="font-size:20px">🤝</div>
      <div><small>产出</small><strong id="flowCount">0 个交换组合</strong></div>
    </div>`;

  const results = state.users
    .map(u=>({u, r:matchScore(me,u)}))
    .filter(x=>!x.r.dead)
    .sort((a,b)=> b.r.score - a.r.score);

  document.getElementById('flowCount').textContent = results.length + ' 个交换组合';

  if(!results.length){
    listEl.innerHTML = `<div class="empty"><div class="empty-ico">🧭</div>
      暂时没有找到互补对象<br><span style="font-size:12.5px">去「发布需求」完善你的技能标签，匹配池会立刻更新</span></div>`;
    return;
  }

  listEl.innerHTML = results.map(({u,r},i)=>{
    const invited = state.requests.some(q=>q.to===u.id && q.status!=='declined');
    const hue = r.score >= 80 ? '#12a06a' : r.score >= 60 ? '#4b5cf6' : '#e8830c';
    return `<div class="card m-card">
      ${avatarHTML(u.name,'lg')}
      <div class="m-body">
        <div class="m-title">${esc(u.name)}
          <span style="font-size:12.5px;font-weight:400;color:#8b93a7">${esc(u.role)}</span>
          ${i===0?'<span class="chip" style="background:#e6f7f0;color:#0a7a51">最佳匹配</span>':''}
        </div>
        <div class="m-desc">你可以从 TA 这里学 <b style="color:#4b5cf6">${r.getFromB.join('、')}</b>；
          你可以教 TA <b style="color:#e8830c">${r.giveToB.join('、')}</b></div>
        <div class="m-meta">
          <span>⏱ ${esc(u.joined||'最近')}加入</span>
          <span>🎁 交换筹码 ${(u.teach||[]).length} 项</span>
          <span>🎯 互补维度 ${r.getFromB.length + r.giveToB.length} 个</span>
        </div>
      </div>
      <div class="ring">
        <svg width="64" height="64">
          <circle cx="32" cy="32" r="27" fill="none" stroke="#eef0f5" stroke-width="6"></circle>
          <circle cx="32" cy="32" r="27" fill="none" stroke="${hue}" stroke-width="6"
                  stroke-linecap="round" stroke-dasharray="${(r.score/100*169.6).toFixed(1)} 169.6"></circle>
        </svg>
        <span style="color:${hue}">${r.score}</span>
      </div>
      <button class="btn ${invited?'btn-g':'btn-p'}" data-invite="${u.id}" ${invited?'disabled':''}>
        ${invited?'已发出':'发起交换'}</button>
    </div>`;
  }).join('');

  listEl.querySelectorAll('[data-invite]').forEach(b=>{
    b.addEventListener('click', ()=>invite(b.dataset.invite));
  });
}

/* =========================================================
   发布需求
   ========================================================= */
let teachSel = [], learnSel = [];

function renderTags(){
  const tEl = document.getElementById('teachTags');
  const lEl = document.getElementById('learnTags');
  tEl.innerHTML = PALETTE.map(s=>`<button class="tag ${teachSel.includes(s)?'on':''}" data-t="${s}">${s}</button>`).join('');
  lEl.innerHTML = PALETTE.map(s=>`<button class="tag ${learnSel.includes(s)?'on':''}" data-l="${s}">${s}</button>`).join('');
  tEl.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>{
    const s = b.dataset.t;
    if(teachSel.includes(s)) teachSel = teachSel.filter(x=>x!==s);
    else{
      if(teachSel.length >= 3){ toast('「能教」最多选择 3 项'); return; }
      teachSel.push(s);
    }
    renderTags();
  }));
  lEl.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('click',()=>{
    const s = b.dataset.l;
    if(learnSel.includes(s)) learnSel = learnSel.filter(x=>x!==s);
    else{
      if(learnSel.length >= 2){ toast('「想学」最多选择 2 项'); return; }
      learnSel.push(s);
    }
    renderTags();
  }));
}

function submitPublish(){
  const name = document.getElementById('pName').value.trim();
  const role = document.getElementById('pRole').value.trim();
  const desc = document.getElementById('pDesc').value.trim();
  if(!name){ toast('请先填写你的昵称'); return; }
  if(!teachSel.length){ toast('至少选择一项「我能教」'); return; }
  if(!learnSel.length){ toast('至少选择一项「我想学」'); return; }

  state.me = {
    id:'me', name, role: role||'交换者', avatar:initial(name),
    teach:[...teachSel], learn:[...learnSel],
    desc: desc||'', joined:'刚刚'
  };
  // 把自己也展示在广场里
  const ex = state.users.find(u=>u.id==='me');
  if(ex) Object.assign(ex, state.me);
  else state.users.unshift({...state.me});

  document.getElementById('meAvatar').style.background = colorOf(name);
  document.getElementById('meAvatar').textContent = initial(name);
  document.querySelector('.me-txt').textContent = name;

  save();
  renderAll();
  toast('发布成功，已加入匹配池');
  go('match');
}

/* =========================================================
   交换请求
   ========================================================= */
function invite(uid){
  const u = state.users.find(x=>x.id===uid);
  if(!u) return;
  const me = state.me;
  const getFromB = overlap(me.learn, u.teach);
  const giveToB  = overlap(me.teach, u.learn);
  if(!getFromB.length || !giveToB.length){ toast('你们暂时没有互补技能'); return; }

  if(state.requests.some(r=>r.to===uid && r.status!=='declined')){ toast('你已经向 TA 发出过邀请'); return; }

  state.requests.unshift({
    id:'r'+Date.now(),
    to:uid, toName:u.name,
    getFromB, giveToB,
    status:'pending',
    time: new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})
  });
  save();
  renderAll();
  toast(`已向 ${u.name} 发起交换邀请`);
  go('inbox');
}

function renderInbox(){
  const el = document.getElementById('inboxList');
  const pending = state.requests.filter(r=>r.status==='pending').length;
  const badge = document.getElementById('navBadge');
  badge.style.display = pending ? 'inline-block' : 'none';
  badge.textContent = pending;

  if(!state.requests.length){
    el.innerHTML = `<div class="empty"><div class="empty-ico">📬</div>
      还没有交换请求<br><span style="font-size:12.5px">去「智能匹配」找一位互补的伙伴，或从「技能广场」直接发起</span></div>`;
    return;
  }

  const stMap = {pending:['st-p','待回应'],accepted:['st-a','已达成'],declined:['st-d','已婉拒']};

  el.innerHTML = state.requests.map(r=>{
    const [cls,txt] = stMap[r.status] || stMap.pending;
    return `<div class="card msg">
      ${avatarHTML(r.toName,'lg')}
      <div class="msg-body">
        <div class="msg-title">向 <i>${esc(r.toName)}</i> 发起技能交换</div>
        <div class="msg-sub">
          你学：${r.getFromB.join('、')} &nbsp;·&nbsp; 你教：${r.giveToB.join('、')} &nbsp;·&nbsp; ${esc(r.time)}
        </div>
      </div>
      <span class="st ${cls}">${txt}</span>
      <div class="msg-act">
        ${r.status==='pending' ? `
          <button class="btn btn-ok btn-sm" data-acc="${r.id}">模拟对方同意</button>
          <button class="btn btn-g btn-sm" data-dec="${r.id}">婉拒</button>
        ` : `<button class="btn btn-g btn-sm" data-del="${r.id}">删除记录</button>`}
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('[data-acc]').forEach(b=>b.addEventListener('click',()=>{
    const r = state.requests.find(x=>x.id===b.dataset.acc);
    if(r){ r.status='accepted'; save(); renderAll(); toast('交换达成！双方可以开始约时间了'); }
  }));
  el.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click',()=>{
    const r = state.requests.find(x=>x.id===b.dataset.dec);
    if(r){ r.status='declined'; save(); renderAll(); toast('已标记为婉拒'); }
  }));
  el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    state.requests = state.requests.filter(x=>x.id!==b.dataset.del);
    save(); renderAll();
  }));
}

/* =========================================================
   路由 & 初始化
   ========================================================= */
function go(v){
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on', s.id === 'v-'+v));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  if(v==='square') renderSquare();
  if(v==='match') renderMatch();
  if(v==='inbox') renderInbox();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderAll(){
  renderStats();
  renderSquare();
  renderMatch();
  renderInbox();
}

function init(){
  load();

  document.querySelectorAll('#nav button').forEach(b=>{
    b.addEventListener('click', ()=>go(b.dataset.v));
  });

  document.getElementById('search').addEventListener('input', e=>{
    keyword = e.target.value.trim();
    renderSquare();
  });

  document.querySelectorAll('.fbtn').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      filter = b.dataset.f;
      renderSquare();
    });
  });

  document.getElementById('reshuffle').addEventListener('click', ()=>{
    renderMatch();
    toast('已按最新画像重新计算');
  });

  document.getElementById('submitPub').addEventListener('click', submitPublish);
  document.getElementById('resetPub').addEventListener('click', ()=>{
    document.getElementById('pName').value = '';
    document.getElementById('pRole').value = '';
    document.getElementById('pDesc').value = '';
    teachSel = []; learnSel = [];
    renderTags();
    toast('已清空表单');
  });

  // 回填「我」的既有画像
  if(state.me.name && state.me.name !== '我'){
    document.getElementById('pName').value = state.me.name;
    document.getElementById('pRole').value = state.me.role==='交换者'?'':state.me.role;
    document.getElementById('pDesc').value = state.me.desc || '';
    teachSel = [...(state.me.teach||[])];
    learnSel = [...(state.me.learn||[])];
    document.getElementById('meAvatar').style.background = colorOf(state.me.name);
    document.getElementById('meAvatar').textContent = initial(state.me.name);
    document.querySelector('.me-txt').textContent = state.me.name;
  }

  renderTags();
  renderAll();
  go('square');
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
